metadata:
  name: custom-yolo-window
  namespace: cvat
  annotations:
    name: YOLO Window (fine-tuned)
    type: detector
    # Phải khớp với model.names của file .pt (hiện tại: {0: window})
    spec: |
      [
        { "id": 0, "name": "window", "type": "rectangle" }
      ]

spec:
  description: YOLO fine-tune cho window detection (CPU)
  runtime: 'python:3.10'
  handler: main:handler
  eventTimeout: 30s
  env:
    - name: MODEL_PATH
      value: /opt/nuclio/model.pt
    - name: DEFAULT_THRESHOLD
      value: "0.25"
    - name: IMGSZ
      value: "640"
    - name: YOLO_OFFLINE
      value: "1"
    - name: YOLO_CONFIG_DIR
      value: /tmp/Ultralytics

  build:
    image: cvat.custom.yolo-window:latest
    baseImage: ubuntu:22.04

    directives:
      preCopy:
        - kind: ENV
          value: DEBIAN_FRONTEND=noninteractive
        - kind: RUN
          value: |-
            apt-get update \
            && apt-get install -y --no-install-recommends \
              python3 python3-pip python-is-python3 libgl1 libglib2.0-0 \
            && rm -rf /var/lib/apt/lists/*
        - kind: RUN
          value: |-
            pip install --no-cache-dir torch==2.5.1 torchvision==0.20.1 \
              --index-url https://download.pytorch.org/whl/cpu
        - kind: RUN
          value: pip install --no-cache-dir ultralytics==8.4.124
        # Nuclio chỉ đóng gói sẵn wheel msgpack cho x86_64; tải bản đúng kiến trúc để build được cả trên ARM
        - kind: RUN
          value: |-
            pip download --no-cache-dir --only-binary=:all: -d /opt/nuclio/whl msgpack==1.1.0
        - kind: WORKDIR
          value: /opt/nuclio

  triggers:
    myHttpTrigger:
      numWorkers: 2
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432 # 32MB
        # Cố định host port: nếu container restart (vd bị OOM) CVAT vẫn gọi đúng port
        port: 32101

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
